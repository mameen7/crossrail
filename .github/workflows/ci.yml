name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crossrail
          POSTGRES_PASSWORD: crossrail
          POSTGRES_DB: crossrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crossrail -d crossrail"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      # e2e global setup creates crossrail_test on the service container and migrates it
      - run: yarn test
