services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crossrail
      POSTGRES_PASSWORD: crossrail
      POSTGRES_DB: crossrail
    ports:
      # Override POSTGRES_PORT if 5432 is already taken on your host.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crossrail -d crossrail']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: crossrail
      DB_PASSWORD: crossrail
      DB_NAME: crossrail
    ports:
      - '3000:3000'

volumes:
  pgdata:
